<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puppy Lovers Page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- Header -->
    <header>
      <h1>Puppy lovers page</h1>
    </header>

    <!-- Hero Image -->
    <div class="hero">
      <img src="images/hero-basket.jpg" alt="Three puppies peeking out of a basket">
    </div>

    <!-- Row: image, missing box, image -->
    <div class="row">
      <div class="box">
        <img src="images/puppy-white-muddy.jpg" alt="White muddy puppy">
      </div>
      <div class="box missing-box">
        <p>Puppy<br>missing<br>here!!</p>
      </div>
      <div class="box">
        <img src="images/puppy-black-corgi.jpg" alt="Black and white corgi puppy">
      </div>
    </div>

    <!-- Section Title -->
    <h2 class="section-title">More Puppies</h2>

    <!-- More Puppies row -->
    <div class="more-puppies">
      <div class="photo">
        <img src="images/puppy-brown-held.jpg" alt="Brown puppy being held">
      </div>
      <div class="photo">
        <img src="images/puppy-white-poodle.jpg" alt="White poodle puppy lying on carpet">
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <h2>Developed by: Girum Alemayehu</h2>
    </footer>

  </div>

</body>
</html>
